repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: detect-private-key

  # Strip Jupyter notebook outputs/execution counts before committing
  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout
        files: "\\.ipynb$"

  - repo: local
    hooks:
      - id: forbid-dotenv
        name: Block committing .env files
        entry: scripts/check_no_dotenv_committed.sh
        language: script
        stages: [pre-commit]

